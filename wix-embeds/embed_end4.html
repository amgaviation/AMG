          <div class="amg-form-group"><label class="amg-form">Certificate Type (select all)</label><div class="amg-cb-group"><label class="amg-cb-item"><input type="checkbox" name="cert" value="ATP" /><span class="amg-cb-label">ATP</span></label><label class="amg-cb-item"><input type="checkbox" name="cert" value="Commercial" /><span class="amg-cb-label">Commercial</span></label><label class="amg-cb-item"><input type="checkbox" name="cert" value="ATP-H" /><span class="amg-cb-label">ATP-H</span></label><label class="amg-cb-item"><input type="checkbox" name="cert" value="CPL-H" /><span class="amg-cb-label">CPL-H</span></label></div></div>

function amgInit() {
  var amgP = window.amgPages || {};
  /* ── ROUTING ── */
  var path = window.location.pathname.replace(/\/$/, '') || '/';
  var content = amgP[path] || amgP['/'];
  document.getElementById('amg-main').innerHTML = content;
  
  /* Mark active nav link */
  document.querySelectorAll('#amg-nav a[data-page]').forEach(function(a) {
    if (a.getAttribute('data-page') === path) a.classList.add('active');
  });
  
  /* ── POPULATE DATE SELECTS ── */
  var daySelect = document.querySelector('[name="day"]');
  var yearSelect = document.querySelector('[name="year"]');
  if (daySelect) { for (var d=1;d<=31;d++) { var o=document.createElement('option'); o.value=d; o.textContent=d; daySelect.appendChild(o); } }
  if (yearSelect) { var y=new Date().getFullYear(); for (var i=y;i<=y+3;i++) { var oy=document.createElement('option'); oy.value=i; oy.textContent=i; yearSelect.appendChild(oy); } }
  
  /* ── FORM SUBMIT HANDLERS ── */
  ['amg-booking-form','amg-pilot-form'].forEach(function(id) {
    var form = document.getElementById(id);
    if (!form) return;
    form.addEventListener('submit', function(e) {
      e.preventDefault();
      var btn = this.querySelector('.amg-btn-submit');
      btn.textContent = 'Submitted ✓';
      btn.style.background = '#166534';
      btn.disabled = true;
    });
  });
  
  /* ── NAV SCROLL ── */
  var nav = document.getElementById('amg-nav');
  var container = document.getElementById('amg-site');
  container.addEventListener('scroll', function() {
    nav.classList.toggle('scrolled', container.scrollTop > 40);
  }, { passive: true });
  
  /* ── HAMBURGER ── */
  var hamburger = document.getElementById('amg-hamburger');
  var mobileMenu = document.getElementById('amg-mobile-menu');
  hamburger.addEventListener('click', function() {
    var open = hamburger.classList.toggle('open');
    mobileMenu.classList.toggle('open', open);
  });
  mobileMenu.querySelectorAll('a').forEach(function(a) {
    a.addEventListener('click', function() {
      hamburger.classList.remove('open');
      mobileMenu.classList.remove('open');
    });
  });
  
  /* ── SCROLL REVEAL ── */
  var observer = new IntersectionObserver(function(entries) {
    entries.forEach(function(e) {
      if (e.isIntersecting) { e.target.classList.add('visible'); observer.unobserve(e.target); }
    });
  }, { threshold: 0.1, rootMargin: '0px 0px -40px 0px', root: container });
  document.querySelectorAll('.amg-reveal').forEach(function(el) { observer.observe(el); });
  
  /* ── NAV LINK INTERCEPT ── */
  document.querySelectorAll('#amg-site a[href^="/"]').forEach(function(a) {
    a.addEventListener('click', function(e) {
      e.preventDefault();
      try { window.parent.location.href = this.getAttribute('href'); }
      catch(err) { window.location.href = this.getAttribute('href'); }
    });
  });
}
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', amgInit);
} else {
  amgInit();
}
</script>
