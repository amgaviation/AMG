<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>:root{--bg-primary:#050B14;--bg-secondary:#07111F;--bg-accent:#0E223D;--blue-steel:#1D4E89;--blue-light:#3B82F6;--text-white:#FFFFFF;--text-soft:#E5E7EB;--text-muted:#9CA3AF;--border-dark:#1F2937;--glass-border:rgba(255,255,255,0.14);--glass-hover:rgba(255,255,255,0.06);--nav-height:72px;--font:'Inter',-apple-system,'Helvetica Neue',sans-serif}
body{background-color:#050B14!important;font-family:'Inter',-apple-system,'Helvetica Neue',sans-serif!important;-webkit-font-smoothing:antialiased;color:#E5E7EB}
#SITE_HEADER,#SITE_FOOTER,#WIX_ADS{display:none!important}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}</style>
<style>
#amg-site{position:fixed;top:0;left:0;width:100%;height:100%;z-index:999999;background:#050B14;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;font-family:'Inter',-apple-system,'Helvetica Neue',sans-serif;color:#E5E7EB;line-height:1.6;-webkit-font-smoothing:antialiased}
#amg-site *,#amg-site *::before,#amg-site *::after{box-sizing:border-box;margin:0;padding:0}
#amg-site a{text-decoration:none;transition:color 0.2s}
#amg-site img{max-width:100%;height:auto;display:block}

/* NAV */
#amg-nav{position:sticky;top:0;z-index:100;height:72px;display:flex;align-items:center;justify-content:space-between;padding:0 5vw;transition:background 0.4s,backdrop-filter 0.4s,border-color 0.4s;border-bottom:1px solid transparent}
#amg-nav.scrolled{background:rgba(5,11,20,0.85);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-color:rgba(255,255,255,0.14)}
.amg-logo{font-size:1.05rem;font-weight:700;letter-spacing:0.08em;color:#fff;text-transform:uppercase}
.amg-nav-links{display:flex;align-items:center;gap:2.2rem;list-style:none}
.amg-nav-links a{font-size:0.82rem;font-weight:500;letter-spacing:0.04em;color:#9CA3AF;text-transform:uppercase}
.amg-nav-links a:hover,.amg-nav-links a.active{color:#fff}
.amg-nav-cta{font-size:0.78rem!important;font-weight:600!important;color:#fff!important;background:#1D4E89;padding:0.5rem 1.2rem;border-radius:6px}
.amg-nav-cta:hover{background:#3B82F6!important}
.amg-hamburger{display:none;flex-direction:column;gap:5px;cursor:pointer;padding:4px;background:none;border:none}
.amg-hamburger span{display:block;width:24px;height:2px;background:#fff;border-radius:2px;transition:all 0.3s}
.amg-hamburger.open span:nth-child(1){transform:translateY(7px) rotate(45deg)}
.amg-hamburger.open span:nth-child(2){opacity:0}
.amg-hamburger.open span:nth-child(3){transform:translateY(-7px) rotate(-45deg)}
#amg-mobile-menu{display:none;background:rgba(5,11,20,0.97);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid rgba(255,255,255,0.14);padding:1.5rem 5vw 2rem;transition:opacity 0.3s}
#amg-mobile-menu.open{display:block}
#amg-mobile-menu a{display:block;font-size:1rem;font-weight:500;color:#E5E7EB;padding:0.85rem 0;border-bottom:1px solid #1F2937}
#amg-mobile-menu a:last-child{border-bottom:none}
#amg-mobile-menu a:hover{color:#fff}

/* HERO */
.amg-hero{min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:6rem 5vw 5rem;background:linear-gradient(180deg,#050B14 0%,#07111F 60%,#050B14 100%);position:relative;overflow:hidden}
.amg-hero::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 80% 50% at 50% 0%,rgba(29,78,137,0.18) 0%,transparent 70%);pointer-events:none}
.amg-hero>div{position:relative;z-index:1}
.amg-eyebrow{display:inline-block;font-size:0.72rem;font-weight:600;letter-spacing:0.18em;text-transform:uppercase;color:#3B82F6;margin-bottom:1.5rem}
.amg-hero h1{font-size:clamp(2.4rem,5.5vw,4.8rem);font-weight:700;line-height:1.1;letter-spacing:-0.02em;color:#fff;max-width:820px;margin:0 auto 1.5rem}
.amg-hero-sub{font-size:clamp(1rem,1.5vw,1.2rem);color:#9CA3AF;max-width:600px;margin:0 auto 2.5rem;line-height:1.7}
.amg-ctas{display:flex;gap:1rem;justify-content:center;flex-wrap:wrap}

/* BUTTONS */
.amg-btn-primary{display:inline-flex;align-items:center;gap:0.5rem;font-size:0.88rem;font-weight:600;color:#fff;background:#1D4E89;padding:0.85rem 2rem;border-radius:8px;transition:background 0.25s,transform 0.2s;border:none;cursor:pointer;font-family:inherit}
.amg-btn-primary:hover{background:#3B82F6;transform:translateY(-1px);color:#fff}
.amg-btn-secondary{display:inline-flex;align-items:center;gap:0.5rem;font-size:0.88rem;font-weight:500;color:#E5E7EB;background:transparent;padding:0.85rem 2rem;border-radius:8px;border:1px solid rgba(255,255,255,0.14);transition:background 0.25s,border-color 0.25s,transform 0.2s;cursor:pointer;font-family:inherit}
.amg-btn-secondary:hover{background:rgba(255,255,255,0.06);border-color:rgba(255,255,255,0.25);transform:translateY(-1px);color:#E5E7EB}

/* SECTIONS */
.amg-section{padding:5.5rem 5vw}
.amg-section-inner{max-width:1100px;margin:0 auto}
.amg-section-inner-sm{max-width:860px;margin:0 auto}
.amg-label{font-size:0.72rem;font-weight:600;letter-spacing:0.16em;text-transform:uppercase;color:#3B82F6;margin-bottom:1rem;display:block}
.amg-title{font-size:clamp(1.8rem,3vw,2.8rem);font-weight:700;letter-spacing:-0.02em;color:#fff;line-height:1.15;margin-bottom:0.6rem}
.amg-title-sm{font-size:clamp(1.6rem,2.6vw,2.2rem);font-weight:700;letter-spacing:-0.02em;color:#fff;margin-bottom:0.6rem}
.amg-sub{font-size:0.95rem;color:#9CA3AF;line-height:1.75;max-width:580px}

/* CARDS */
.amg-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:1.5rem}
.amg-grid-2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:1.5rem}
.amg-card{background:#0E223D;border:1px solid rgba(255,255,255,0.14);border-radius:12px;padding:2rem;transition:border-color 0.25s,transform 0.25s}
.amg-card:hover{border-color:rgba(59,130,246,0.4);transform:translateY(-3px)}
.amg-card-icon{font-size:1.6rem;margin-bottom:1rem}
.amg-card-tag{display:inline-block;font-size:0.65rem;font-weight:600;letter-spacing:0.12em;text-transform:uppercase;color:#3B82F6;background:rgba(59,130,246,0.1);border:1px solid rgba(59,130,246,0.2);padding:0.25rem 0.6rem;border-radius:4px;margin-bottom:0.8rem}
.amg-card-title{font-size:1.05rem;font-weight:700;color:#fff;margin-bottom:0.5rem}
.amg-card-desc{font-size:0.86rem;color:#9CA3AF;line-height:1.75}

/* CAPABILITIES GRID */
.amg-cap-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:1.5px;background:#1F2937;border:1px solid #1F2937;border-radius:12px;overflow:hidden;margin-top:2.5rem}
.amg-cap-card{background:#07111F;padding:2.5rem 2rem;text-align:center;transition:background 0.25s}
.amg-cap-card:hover{background:#0E223D}
.amg-cap-icon{font-size:1.8rem;margin-bottom:1rem}
.amg-cap-title{font-size:1.1rem;font-weight:700;color:#fff;margin-bottom:0.4rem}
.amg-cap-desc{font-size:0.85rem;color:#9CA3AF}

/* PHILOSOPHY / 2-COL */
.amg-2col{display:grid;grid-template-columns:1fr 1fr;gap:5rem;align-items:center}
.amg-2col p{color:#9CA3AF;font-size:0.95rem;line-height:1.8;margin-top:1.5rem}
.amg-2col p+p{margin-top:1rem}
.amg-value-grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.amg-value-card{background:#0E223D;border:1px solid rgba(255,255,255,0.14);border-radius:10px;padding:1.6rem 1.4rem;transition:border-color 0.25s,transform 0.25s}
.amg-value-card:hover{border-color:rgba(59,130,246,0.4);transform:translateY(-3px)}
.amg-value-dot{width:8px;height:8px;background:#3B82F6;border-radius:50%;margin-bottom:0.8rem}
.amg-value-title{font-size:0.95rem;font-weight:600;color:#fff}

/* PAGE HERO */
.amg-page-hero{padding:6rem 5vw 4rem;text-align:center;background:linear-gradient(180deg,#050B14 0%,#07111F 100%);position:relative;overflow:hidden}
.amg-page-hero::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 70% 50% at 50% 0%,rgba(29,78,137,0.15) 0%,transparent 70%);pointer-events:none}
.amg-page-hero>*{position:relative;z-index:1}
.amg-page-hero h1{font-size:clamp(2.2rem,4.5vw,4rem);font-weight:700;color:#fff;letter-spacing:-0.02em;line-height:1.1;margin-bottom:1rem}
.amg-page-hero p{font-size:1.05rem;color:#9CA3AF;max-width:560px;margin:0 auto;line-height:1.75}

/* TEAM */
.amg-team-card{background:#0E223D;border:1px solid rgba(255,255,255,0.14);border-radius:16px;overflow:hidden;transition:border-color 0.25s,transform 0.3s}
.amg-team-card:hover{border-color:rgba(59,130,246,0.35);transform:translateY(-4px)}
.amg-team-photo{width:100%;aspect-ratio:4/3;object-fit:cover;background:#07111F;display:block}
.amg-team-photo-ph{width:100%;aspect-ratio:4/3;background:linear-gradient(135deg,#07111F 0%,#0E223D 100%);display:flex;align-items:center;justify-content:center;font-size:4rem;color:#1F2937}
.amg-team-body{padding:2rem 1.8rem}
.amg-team-role{font-size:0.7rem;font-weight:600;letter-spacing:0.12em;text-transform:uppercase;color:#3B82F6;margin-bottom:0.5rem}
.amg-team-name{font-size:1.3rem;font-weight:700;color:#fff;margin-bottom:1.2rem}
.amg-quals{display:flex;flex-wrap:wrap;gap:0.5rem}
.amg-qual{font-size:0.72rem;font-weight:500;color:#E5E7EB;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.14);padding:0.3rem 0.7rem;border-radius:4px}
.amg-team-hours{margin-top:1rem;font-size:0.85rem;color:#9CA3AF}

/* AIRCRAFT GRID */
.amg-aircraft-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:1.5px;background:#1F2937;border:1px solid #1F2937;border-radius:12px;overflow:hidden}
.amg-ac-card{background:#0E223D;padding:1.8rem 1.6rem;transition:background 0.25s}
.amg-ac-card:hover{background:#112840}
.amg-ac-make{font-size:0.68rem;font-weight:600;letter-spacing:0.12em;text-transform:uppercase;color:#3B82F6;margin-bottom:0.4rem}
.amg-ac-model{font-size:1.05rem;font-weight:700;color:#fff;margin-bottom:0.4rem}
.amg-ac-desc{font-size:0.82rem;color:#9CA3AF;line-height:1.6}

/* JET CARDS */
.amg-jet-card{background:#0E223D;border:1px solid rgba(255,255,255,0.14);border-radius:12px;padding:2rem 1.8rem;transition:border-color 0.25s,transform 0.25s}
.amg-jet-card:hover{border-color:rgba(59,130,246,0.4);transform:translateY(-3px)}
.amg-jet-badge{display:inline-flex;align-items:center;font-size:0.65rem;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;color:#3B82F6;background:rgba(59,130,246,0.1);border:1px solid rgba(59,130,246,0.2);padding:0.25rem 0.65rem;border-radius:4px;margin-bottom:1rem}
.amg-jet-model{font-size:1.25rem;font-weight:700;color:#fff;margin-bottom:0.3rem}
.amg-jet-variant{font-size:0.82rem;color:#9CA3AF;margin-bottom:1rem}
.amg-spec{display:flex;justify-content:space-between;font-size:0.82rem;padding:0.4rem 0;border-bottom:1px solid #1F2937}
.amg-spec:last-child{border-bottom:none}
.amg-spec-label{color:#9CA3AF}
.amg-spec-value{color:#fff;font-weight:500}

/* CONTACT */
.amg-contact-grid{display:grid;grid-template-columns:1fr 1fr;gap:1.5rem;margin-bottom:1.5rem}
.amg-contact-card{background:#0E223D;border:1px solid rgba(255,255,255,0.14);border-radius:14px;padding:2rem 1.8rem;transition:border-color 0.25s,transform 0.25s}
.amg-contact-card:hover{border-color:rgba(59,130,246,0.4);transform:translateY(-3px)}
.amg-contact-lbl{font-size:0.7rem;font-weight:600;letter-spacing:0.12em;text-transform:uppercase;color:#9CA3AF;margin-bottom:0.5rem}
.amg-contact-val{font-size:1.05rem;font-weight:600;color:#fff}
.amg-contact-val a{color:#fff}
.amg-contact-val a:hover{color:#3B82F6}
.amg-contact-sub{font-size:0.82rem;color:#9CA3AF;margin-top:0.4rem}

/* PROCESS STEPS */
.amg-steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:0}
.amg-step{padding:2rem 1.5rem;border:1px solid #1F2937;background:#07111F}
.amg-step:first-child{border-radius:12px 0 0 12px}
.amg-step:last-child{border-radius:0 12px 12px 0}
.amg-step-num{font-size:0.68rem;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:#3B82F6;margin-bottom:0.6rem}
.amg-step-title{font-size:1rem;font-weight:700;color:#fff;margin-bottom:0.4rem}
.amg-step-desc{font-size:0.82rem;color:#9CA3AF;line-height:1.65}

/* FORM */
.amg-form-wrap{max-width:720px;margin:0 auto}
.amg-form{display:flex;flex-direction:column;gap:1.4rem}
.amg-form-row{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.amg-form-row-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:1rem}
.amg-form-group{display:flex;flex-direction:column;gap:0.4rem}
.amg-form label{font-size:0.75rem;font-weight:600;letter-spacing:0.04em;text-transform:uppercase;color:#9CA3AF}
.amg-form input,.amg-form select,.amg-form textarea{font-family:inherit;font-size:0.92rem;color:#fff;background:#0E223D;border:1px solid #1F2937;border-radius:7px;padding:0.72rem 0.9rem;outline:none;transition:border-color 0.2s;-webkit-appearance:none;appearance:none;width:100%}</style>
